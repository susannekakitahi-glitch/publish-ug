app = "posta-backend-ucvedwse"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
# ZERNIO_API_KEY is intentionally NOT listed here. It's a real secret and
# must be provided via Fly secrets:
#   flyctl secrets set ZERNIO_API_KEY=sk_... -a posta-backend-ucvedwse

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
